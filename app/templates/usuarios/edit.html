{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>Editar Usuario</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text"
                           name="username"
                           class="form-control"
                           value="{{ usuario.username }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ usuario.email }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Nueva Contraseña
                    </label>
                    <input type="password"
                           name="password"
                           class="form-control">

                    <div class="form-text">
                        Déjelo vacío para mantener la contraseña actual.
                    </div>
                </div>

                <button type="submit"
                        class="btn btn-success">
                    Guardar Cambios
                </button>

                <a href="{{ url_for('usuarios.index') }}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
