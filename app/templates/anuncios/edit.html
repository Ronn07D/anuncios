{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>Editar Anuncio</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text"
                           name="titulo"
                           class="form-control"
                           value="{{ anuncio.titulo }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría</label>

                    <select name="categoria_id"
                            class="form-select"
                            required>

                        {% for categoria in categorias %}

                        <option value="{{ categoria.id }}"
                            {% if categoria.id == anuncio.categoria_id %}
                                selected
                            {% endif %}>
                            {{ categoria.nombre }}
                        </option>

                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contenido</label>

                    <textarea name="contenido"
                              class="form-control"
                              rows="5"
                              required>{{ anuncio.contenido }}</textarea>
                </div>

                <button type="submit"
                        class="btn btn-success">
                    Guardar Cambios
                </button>

                <a href="{{ url_for('anuncios.index') }}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
